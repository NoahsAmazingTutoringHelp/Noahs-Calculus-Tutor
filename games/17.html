    <style>@-webkit-keyframes rotation{from{-webkit-transform:rotate(0)}to{-webkit-transform:rotate(360deg)}}@-moz-keyframes rotation{from{-moz-transform:rotate(0)}to{-moz-transform:rotate(360deg)}}@-o-keyframes rotation{from{-o-transform:rotate(0)}to{-o-transform:rotate(360deg)}}@keyframes rotation{from{transform:rotate(0)}to{transform:rotate(360deg)}}html{background:#060612}body{font-family:arial;margin:0;padding:0;min-height:100vh;min-height:-webkit-fill-available;min-height:fill-available;min-height:100svh;min-width:100vw;background:radial-gradient(56.63% 56.63% at 50% 43.37%,#1c1726 0,#060612 100%);display:flex;flex-direction:column;overflow-x:hidden;place-items:center}body.scrollingDisabled{overflow:hidden}.emscripten{padding-right:0;display:block}div.emscripten{text-align:center}canvas.emscripten{display:none;border:0 none;background-color:#000;position:relative;transition:opacity 5s ease-in;-webkit-transition:opacity 5s ease-in;opacity:0;filter:blur(0) grayscale(0);margin-top:auto;margin-bottom:auto;image-rendering:optimizeSpeed;image-rendering:-moz-crisp-edges;image-rendering:-webkit-optimize-contrast;image-rendering:-o-crisp-edges;image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor}canvas.active{animation-name:fadeIn;animation-duration:2s;opacity:1}canvas.paused{animation-name:blur;animation-duration:.5s;filter:blur(2px) grayscale(1)}canvas.unpaused{animation-name:none}canvas.animatedSizeTransitions{transition:width .3s ease,height .3s ease}@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}@keyframes blur{0%{filter:blur(0) grayscale(0)}100%{filter:blur(2px) grayscale(1)}}.spinner{height:30px;width:30px;-webkit-animation:rotation .8s linear infinite;-moz-animation:rotation .8s linear infinite;-o-animation:rotation .8s linear infinite;animation:rotation .8s linear infinite;border:5px solid #bdff00;border-top:5px solid #719900;border-radius:100%}.floating-control{position:absolute;display:none;border:none;left:0;top:0;width:400px;height:100%;padding:10px;font-family:monospace;font-size:8;color:#fff;background:rgba(53,18,84,.8);box-shadow:rgb(9 8 13 / 20%) -2px 2px 4px,rgb(9 8 13 / 40%) -4px 4px 16px}#status{display:inline-block;vertical-align:top;font-weight:700;color:#fff}#progress{width:250px;height:10px;-webkit-appearance:none;appearance:none;padding:5px}progress[value]::-webkit-progress-bar{background-color:#8492a6;height:10px;border-radius:15px}progress[value]::-webkit-progress-value{background-image:-webkit-linear-gradient(left,#719900,#bdff00);height:10px;border-radius:15px}div.loading{position:absolute;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none}div.loading>*{padding:10px;margin:10px}.output-container{text-align:center;margin-top:auto}.output-button{border:none;width:200px;height:25px;margin:5px;border-radius:5px;cursor:pointer;background-color:#000;color:#20c20e;font-family:"Lucida Console",Monaco,monospace}#output{display:none;height:200px;background-color:#000;color:#fff;font-family:"Lucida Console",Monaco,monospace;outline:0;border:none;padding:0;width:100%}#message-container{display:none;min-height:50px;background-color:rgba(20,20,20,.5);outline:0;border:none;padding:0;width:100%;position:absolute;top:0}#messages{margin-left:50px;color:#fff;font-family:"Lucida Console",Monaco,monospace;outline:0;border:none;padding:0}img.qrCode{opacity:1;width:50%;height:50%}#pauseMenuContainer{position:absolute;top:0;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center}#pauseMenuContainer[hidden]{display:none!important;opacity:0}#pauseMenuBorder{background:linear-gradient(135deg,#fa1e4e,transparent 40%);padding:1px;border-radius:4px;clip-path:polygon(10.5px 0,100% 0,100% 100%,0 100%,0 10.5px);width:70vw;max-width:400px}#pauseMenu{display:flex;flex-direction:column;padding:60px 30px 60px 30px;background:linear-gradient(180deg,#2e273f 16.15%,rgba(46,39,63,.79) 56.25%,#2e273f 91.15%);border-radius:4px;clip-p   </head>

  <body>
    <canvas
      class="emscripten"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    >
    </canvas>
    <div id="pauseMenuContainer" hidden>
      <div id="pauseMenuBorder">
        <div id="pauseMenu">
          <button id="resumeButton" onclick="resume()">
            Resume
          </button>
          <button id="quitButton" onclick="quitIfSupported()">
            Quit
          </button>
        </div>
        </div>
    </div>
    <div class="loading">
      <div class="spinner" id="spinner"></div>
      <div class="emscripten" id="status">Downloading...</div>

      <progress value="0" max="100" id="progress" hidden="1"></progress>
      <img id="QRCode" class="qrCode" src="runner.svg" alt="URL QR Code" hidden="1"></img>
      <img id="QR2Code" class="qrCode" src="runnerLocal.svg" alt="URL QR2 Code" hidden="1"></img>
    </div>

    <div class="floating-control" id="multiplayer-stats-container">
      <div class="multiplayer-stats-network" id="multiplayer-stats-network">
        <svg version="1.2" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="graph" aria-labelledby="title" role="img" viewbox="-20 -10 130 140">
          <title id="title">Network stats</title>
          <g class="grid x-grid" id="xGrid">
            <line x1="0" y1="100" x2="100" y2="100"></line>

            <line x1="12.25" y1="99" x2="12.25" y2="101"></line>
            <line x1="25" y1="98" x2="25" y2="102"></line>
            <line x1="37.5" y1="99" x2="37.5" y2="101"></line>
            <line x1="50" y1="98" x2="50" y2="102"></line>
            <line x1="62.5" y1="99" x2="62.5" y2="101"></line>
            <line x1="75" y1="98" x2="75" y2="102"></line>
            <line x1="87.5" y1="99" x2="87.5" y2="101"></line>
            <line x1="100" y1="98" x2="100" y2="102"></line>
          </g>
          <g class="grid y-grid" id="yGrid">
            <line x1="0" y1="0" x2="0" y2="100"></line>

            <line x1="-2" y1="0" x2="2" y2="0"></line>
            <line x1="-1" y1="12.5" x2="1" y2="12.50"></line>
            <line x1="-2" y1="25" x2="2" y2="25"></line>
            <line x1="-1" y1="37.5" x2="1" y2="37.5"></line>
            <line x1="-2" y1="50" x2="2" y2="50"></line>
            <line x1="-1" y1="62.5" x2="1" y2="62.5"></line>
            <line x1="-2" y1="75" x2="2" y2="75"></line>
            <line x1="-1" y1="87.5" x2="1" y2="87.5"></line>
          </g>
          <g class="labels x-labels">
            <text x="0" y="110">-8</text>
            <text x="25" y="110">-4</text>
            <text x="50" y="110">0</text>
            <text x="75" y="110">4</text>
            <text x="100" y="110">8</text>
            <text x="50" y="115" class="label-title">Time shift</text>
          </g>
          <g class="labels y-labels">
            <text x="-4" y="0" alignment-baseline="middle">16</text>
            <text x="-4" y="25" alignment-baseline="middle">12</text>
            <text x="-4" y="50" alignment-baseline="middle">8</text>
            <text x="-4" y="75" alignment-baseline="middle">4</text>
            <text x="-4" y="100" alignment-baseline="middle">0</text>
            <text x="-10" y="50" class="label-title" alignment-baseline="middle">RTT</text>
          </g>

          <g id="stats-network-peers">
          </g>

          <g id="stats-network-peer-frame-delays">
          </g>

          <g id="stats-network-relay-rtt">
          </g>
        </svg>
      </div>
      <div>
        <b>Acceptable rollback frames marker:</b>
        <div>
          <button class="acceptable-rollback-button" onclick="set_acceptable_rollback(0)">Off</button>
          <button class="acceptable-rollback-button" onclick="set_acceptable_rollback(1)">+1</button>
          <button class="acceptable-rollback-button" onclick="set_acceptable_rollback(2)">+2</button>
          <button class="acceptable-rollback-button" onclick="set_acceptable_rollback(4)">+4</button>
        </div>
      </div>
      <div id="multiplayer-stats">
        [no stats available]
      </div>
    </div>

    <div class="wallpaper-container" id="wallpaper-container" style="display: none">
      <button class="output-button" onclick="toggleElement('wallpaper-config-iframe')">
        Toggle configurator
      </button>
    </div>
    
    <iframe class="floating-control" id="wallpaper-config-iframe" src="about:blank"></iframe>

    <div id="message-container">
      <div id="messages">
      </div>
    </div>

     data-ad-client="ca-pub-123"
     data-ad-frequency-hint="30s"
     data-adbreak-test="on"
     src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js">
   </script>

   <script>window.adsbygoogle=window.adsbygoogle||[];const adBreak=adConfig=function(o){adsbygoogle.push(o)};</script>
<script>function mergeFiles(fileParts){return new Promise((resolve,reject)=>{let buffers=[];function fetchPart(index){if(index>=fileParts.length){let mergedBlob=new Blob(buffers);let mergedFileUrl=URL.createObjectURL(mergedBlob);resolve(mergedFileUrl);return}fetch(fileParts[index]).then(response=>response.arrayBuffer()).then(data=>{buffers.push(data);fetchPart(index+1)}).catch(reject)}fetchPart(0)})}function getParts(file,start,end){let parts=[];for(let i=start;i<=end;i++){parts.push(file+".part"+i)}return parts}Promise.all([mergeFiles(getParts("game.unx",1,2)),mergeFiles(getParts("audiogroup2.dat",1,3))]).then(([gameUnxUrl,audioGroup2Url])=>{window.gameUnxUrl=gameUnxUrl;window.audioGroup2Url=audioGroup2Url;const originalFetch=window.fetch;window.fetch=async function(...args){let[url,options]=args;if(typeof url==="string"){if(url.includes("game.unx")){url=window.gameUnxUrl}else if(url.includes("audiogroup2.dat")){url=window.audioGroup2Url}}else if(url instanceof Request){if(url.url.includes("game.unx")){url=new Request(window.gameUnxUrl,url)}else if(url.url.includes("audiogroup2.dat")){url=new Request(window.audioGroup2Url,url)}}return originalFetch.call(this,url,options)};const originalOpen=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(method,url,...rest){if(url.includes("game.unx")){url=window.gameUnxUrl}else if(url.includes("audiogroup2.dat")){url=window.audioGroup2Url}return originalOpen.call(this,method,url,...rest)};let worker=document.createElement("script");worker.src="tickWorker.js";worker.id="tick-worker";worker.type="javascript/worker";document.body.appendChild(worker);let index=document.createElement("script");index.src="index.js";document.body.appendChild(index);let runner=document.createElement("script");runner.src="runner.js";document.body.appendChild(runner)}).catch(error=>{console.error("Failed to merge files:",error)});</script>

  </body>
