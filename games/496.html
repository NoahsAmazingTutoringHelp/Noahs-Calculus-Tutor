<html>
<head>
<script>alert("NDS core is heavier than GBA. Wait for the play button. MelonDS WASM takes 10-30s on first load.");</script>
<script src="//www.google.com/jsapi"></script>
<script>window.parent.maeExportApis_();</script>
<style>
body{overflow:hidden;background:#000;margin-top:0;margin-left:0;color:#000}
#startButton{display:block;width:160px;height:40px;background-color:#4caf50;color:#fff;text-align:center;text-decoration:none;font-size:16px;margin:20px auto;padding:10px 20px;border:none;border-radius:8px;cursor:pointer;font-family:'Press Start 2P',cursive;box-shadow:0 0 10px 2px #000}
#status{color:#0f0;font-family:monospace;text-align:center;margin-top:10px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style type="text/css">#button{display:none}.imgb_vis{animation:imgb-animation 7s linear}@keyframes imgb-animation{10%{transform:translateX(0)}20%{transform:translateX(100px)}90%{transform:translateX(100px)}100%{transform:translateX(0)}}</style>
</head>

<body>
<div style="width:100vw;height:100vh;max-width:100%">
<div id="game" style="display:none;"></div>
<button id="startButton">PLAY</button>
<div id="status"></div>
</div>

<script>
document.getElementById("game").style.display="none";

var BASE = "https://cdn.jsdelivr.net/gh/thirstygithub/bug-free-meme@main/Nana/";
var NAME = "NANA - Live Staff Daiboshuu! Shoshinsha Kangei (Japan).nds";
var PARTS = [
  BASE + encodeURIComponent(NAME) + ".part1",
  BASE + encodeURIComponent(NAME) + ".part2",
  BASE + encodeURIComponent(NAME) + ".part3",
  BASE + encodeURIComponent(NAME) + ".part4"
];

async function buildIso() {
  var status = document.getElementById("status");
  var chunks = [];
  for (var i = 0; i < PARTS.length; i++) {
    status.textContent = "fetching part " + (i+1) + "/" + PARTS.length;
    var res = await fetch(PARTS[i]);
    if (!res.ok) throw new Error("part " + (i+1) + " HTTP " + res.status);
    var buf = await res.arrayBuffer();
    chunks.push(new Uint8Array(buf));
    status.textContent = "part " + (i+1) + " ok (" + buf.byteLength + " bytes)";
  }
  var total = chunks.reduce(function(a,c){return a + c.length;}, 0);
  status.textContent = "merging " + total + " bytes";
  var merged = new Uint8Array(total);
  var off = 0;
  for (var j = 0; j < chunks.length; j++) {
    merged.set(chunks[j], off);
    off += chunks[j].length;
  }
  var blob = new Blob([merged], {type: "application/octet-stream"});
  return URL.createObjectURL(blob);
}

async function startGame() {
  var status = document.getElementById("status");
  try {
    var isoUrl = await buildIso();
    status.textContent = "iso ready, booting emulator";

    document.getElementById("game").style.display = "block";
    document.getElementById("startButton").style.display = "none";

    window.EJS_player = "#game";
    window.EJS_core = "melonds";
    window.EJS_color = "#000000";
    window.EJS_startOnLoaded = true;
    window.EJS_pathtodata = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data";
    window.EJS_gameUrl = isoUrl;
    window.EJS_gameName = NAME;

    var s1 = document.createElement("script");
    s1.src = "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/loader.js";
    document.body.appendChild(s1);

    var s2 = document.createElement("script");
    s2.src = "https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/storage/js/cloak.js";
    document.body.appendChild(s2);
  } catch (e) {
    status.textContent = "ERROR: " + e.message;
  }
}

document.getElementById("startButton").addEventListener("click", startGame);
</script>
</body>
</html>
