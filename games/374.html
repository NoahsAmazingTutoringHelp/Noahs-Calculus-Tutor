    <script>var loadingText=document.querySelector("#loading-text");let totalBytes=0;let loadedBytes=0;async function fetchWithProgress(url){const response=await fetch(url);const reader=response.body.getReader();let chunks=[];let received=0;while(true){const{done:done,value:value}=await reader.read();if(done)break;received+=value.length;loadedBytes+=value.length;chunks.push(value);let mbDone=(loadedBytes/(1024*1024)).toFixed(2);let mbTotal="684.84";loadingText.textContent=`LOADING... ${mbDone} MB / ${mbTotal} MB`}let fullBuffer=new Uint8Array(received);let offset=0;for(let chunk of chunks){fullBuffer.set(chunk,offset);offset+=chunk.length}return fullBuffer.buffer}async function mergeFiles(fileParts,cacheKey){const buffers=await Promise.all(fileParts.map(part=>fetchWithProgress(part)));const mergedBlob=new Blob(buffers);return URL.createObjectURL(mergedBlob)}function getParts(file,start,end){let parts=[];for(let i=start;i<=end;i++){parts.push(file+".part"+i)}return parts}(async()=>{const[dataUrl,wasmUrl]=await Promise.all([mergeFiles(getParts("Build/BATIMFullPort.data",1,33),"BATIMFullPort.data"),mergeFiles(getParts("Build/BATIMFullPort.wasm",1,2),"BATIMFullPort.wasm")]);var container=document.querySelector("#unity-container");var canvas=document.querySelector("#unity-canvas");var loadingBar=document.querySelector("#unity-loading-bar");var progressBarFull=document.querySelector("#unity-progress-bar-full");var warningBanner=document.querySelector("#unity-warning");function unityShowBanner(msg,type){}var buildUrl="Build";var loaderUrl=buildUrl+"/BATIMFullPort.loader.js";var config={arguments:[],dataUrl:dataUrl,frameworkUrl:buildUrl+"/BATIMFullPort.framework.js",codeUrl:wasmUrl,streamingAssetsUrl:"StreamingAssets",companyName:"Joey Drew Studios",productName:"Bendy and the Ink Machine",productVersion:"1.0",showBanner:unityShowBanner};if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){var meta=document.createElement("meta");meta.name="viewport";meta.content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";document.getElementsByTagName("head")[0].appendChild(meta)}loadingBar.style.display="block";var script=document.createElement("script");script.src=loaderUrl;script.onload=()=>{createUnityInstance(canvas,config,progress=>{progressBarFull.style.width=100*progress+"%"}).then(unityInstance=>{loadingBar.style.display="none";loadingText.remove()}).catch(message=>{})};document.body.appendChild(script)})();</script>
