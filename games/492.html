<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Gang Beasts</title>
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/jmhq20120212-cmd/GangBeast-WebPort@main/TemplateData/favicon.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jmhq20120212-cmd/GangBeast-WebPort@main/TemplateData/style.css">
    <script>
      // Hijack window.fetch to route traffic: jsDelivr for scripts/json, rawgit for heavy binaries
      const originalFetch = window.fetch;
      window.fetch = async function(resource, init) {
        let url = typeof resource === 'string' ? resource : (resource instanceof Request ? resource.url : '');
        
        if (!url.startsWith('http') && !url.startsWith('blob:') && !url.startsWith('data:')) {
          url = url.replace(/^\/+/, '');
          if (url.endsWith('.json') || url.endsWith('.js') || url.endsWith('.css') || url.endsWith('.ico')) {
            url = "https://cdn.jsdelivr.net/gh/jmhq20120212-cmd/GangBeast-WebPort@main/" + url;
          } else {
            url = "https://raw.githubusercontent.com/jmhq20120212-cmd/GangBeast-WebPort/main/" + url;
          }
        }
        return originalFetch(resource instanceof Request ? new Request(url, resource) : url, init);
      };
    </script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=1280 height=720></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-mobile-warning">
        WebGL builds are not supported on mobile devices.
      </div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Gang Beasts</div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/gh/jmhq20120212-cmd/GangBeast-WebPort@main/game-data.js"></script>
    <script>
      var buildUrl = "Build";
      var loaderUrl = "https://cdn.jsdelivr.net/gh/jmhq20120212-cmd/GangBeast-WebPort@main/Build/WebGLValidation.loader.js";
      var config = {
        dataUrl: "Build/WebGLValidation.data",
        frameworkUrl: "https://cdn.jsdelivr.net/gh/jmhq20120212-cmd/GangBeast-WebPort@main/Build/WebGLValidation.framework.js",
        codeUrl: "https://raw.githubusercontent.com/jmhq20120212-cmd/GangBeast-WebPort/main/Build/WebGLValidation.wasm",
        streamingAssetsUrl: "https://raw.githubusercontent.com/jmhq20120212-cmd/GangBeast-WebPort/main/StreamingAssets",
        companyName: "Boneloaf",
        productName: "Gang Beasts",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var mobileWarning = document.querySelector("#unity-mobile-warning");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
        mobileWarning.style.display = "block";
        setTimeout(() => {
          mobileWarning.style.display = "none";
        }, 5000);
      } else {
        canvas.style.width = "1280px";
        canvas.style.height = "720px";
      }
      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        var dataBlobUrl;
        try {
          dataBlobUrl = await loadGameData("Build/data-manifest.json", (progress) => {
            progressBarFull.style.width = (80 * progress) + "%";
          });
          config.dataUrl = dataBlobUrl;
        await createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (80 + 20 * progress) + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        });
        } catch (error) {
          console.error(error);
          alert("No se pudo cargar el juego. Recarga para volver a intentarlo. " + error.message);
        } finally {
          if (dataBlobUrl) URL.revokeObjectURL(dataBlobUrl);
        }
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
