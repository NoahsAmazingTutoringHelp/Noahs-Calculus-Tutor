<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Kerbal Space Program</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace;
        }
        #unity-container {
            width: 100vw !important;
            height: 100vh !important;
            position: absolute;
            top: 0;
            left: 0;
        }
        #unity-canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }
        #custom-loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.3s ease-out;
        }
        .progress-container {
            width: 200px;
            height: 4px;
            background: #222222;
            margin-bottom: 10px;
        }
        #progress-fill {
            width: 0%;
            height: 100%;
            background: #ffffff;
            transition: width 0.1s linear;
        }
        #loader-status {
            color: #ffffff;
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
    </div>
    <div id="custom-loader">
        <div class="progress-container">
            <div id="progress-fill"></div>
        </div>
        <div id="loader-status">0%</div>
    </div>
    <script>
        const BASE = "https://cdn.jsdelivr.net/gh/thirstygithub/mibomboclat@main/";
        const RAW_BASE = "https://raw.githubusercontent.com/thirstygithub/mibomboclat/main/";
        const loaderStatus = document.getElementById('loader-status');
        const progressFill = document.getElementById('progress-fill');
        const customLoader = document.getElementById('custom-loader');

        function updateProgress(percent) {
            if (percent !== null) {
                const p = Math.min(100, Math.max(0, Math.round(percent)));
                progressFill.style.width = p + '%';
                loaderStatus.innerText = p + '%';
            }
        }

        async function fetchFile(url) {
            const r = await fetch(url);
            if (!r.ok) throw new Error("Failed: " + url);
            return r.arrayBuffer();
        }

        async function fetchWithFallback(path) {
            try {
                return await fetchFile(BASE + path);
            } catch (e) {
                return await fetchFile(RAW_BASE + path);
            }
        }

        async function fetchChunks(baseName, startIndex, count, padDigits, progressStart, progressEnd) {
            const buffers = [];
            let total = 0;
            for (let i = 0; i < count; i++) {
                const idx = startIndex + i;
                const padded = padDigits > 0 ? String(idx).padStart(padDigits, '0') : String(idx);
                const path = baseName + ".part" + padded;
                updateProgress(progressStart + ((i / count) * (progressEnd - progressStart)));
                const buf = await fetchWithFallback(path);
                buffers.push(buf);
                total += buf.byteLength;
            }
            const out = new Uint8Array(total);
            let off = 0;
            for (const b of buffers) { out.set(new Uint8Array(b), off); off += b.byteLength; }
            return out;
        }

        const preloadedAssets = {};

        async function preloadStreamingPack(baseName, partCount, progressStart, progressEnd) {
            const buffers = [];
            let total = 0;
            for (let i = 1; i <= partCount; i++) {
                const path = baseName + ".part" + i;
                updateProgress(progressStart + (((i - 1) / partCount) * (progressEnd - progressStart)));
                const buf = await fetchWithFallback(path);
                buffers.push(buf);
                total += buf.byteLength;
            }
            const out = new Uint8Array(total);
            let off = 0;
            for (const b of buffers) { out.set(new Uint8Array(b), off); off += b.byteLength; }
            const blob = new Blob([out], { type: "application/octet-stream" });
            preloadedAssets[baseName] = URL.createObjectURL(blob);
        }

        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
            const url = (typeof input === 'string') ? input : input.url;
            for (const [key, blobUrl] of Object.entries(preloadedAssets)) {
                const fileName = key.split('/').pop();
                if (url.includes(fileName) && !url.includes('.part')) {
                    return originalFetch(blobUrl, init);
                }
            }
            return originalFetch(input, init);
        };

        async function boot() {
            try {
                const dataBytes = await fetchChunks("Build/Build.data", 1, 21, 2, 0, 30);
                const dataUrl = URL.createObjectURL(new Blob([dataBytes]));

                updateProgress(33);
                const fwBuf = await fetchWithFallback("Build/Build.framework.js");
                const fwText = new TextDecoder().decode(fwBuf);
                const fwScript = document.createElement("script");
                fwScript.textContent = fwText;
                document.head.appendChild(fwScript);
                const fwUrl = URL.createObjectURL(new Blob([""], { type: "application/javascript" }));

                const wasmBytes = await fetchChunks("Build/Build.wasm", 1, 3, 0, 35, 50);
                const wasmUrl = URL.createObjectURL(new Blob([wasmBytes], { type: "application/wasm" }));

                await preloadStreamingPack("StreamingAssets/ksp/core.000.pack", 3, 50, 65);
                await preloadStreamingPack("StreamingAssets/ksp/core.001.pack", 2, 65, 75);

                updateProgress(78);
                var canvas = document.querySelector("#unity-canvas");

                var config = {
                    arguments: [],
                    dataUrl: dataUrl,
                    frameworkUrl: fwUrl,
                    codeUrl: wasmUrl,
                    streamingAssetsUrl: RAW_BASE + "StreamingAssets",
                    companyName: "Squad",
                    productName: "Kerbal Space Program",
                    productVersion: "1.0",
                };

                updateProgress(80);
                const loaderBuf = await fetchWithFallback("Build/Build.loader.js");
                const loaderText = new TextDecoder().decode(loaderBuf);
                const loaderScript = document.createElement("script");
                loaderScript.textContent = loaderText;
                document.head.appendChild(loaderScript);

                updateProgress(85);

                createUnityInstance(canvas, config, (progress) => {
                    updateProgress(85 + (progress * 15));
                }).then((unityInstance) => {
                    updateProgress(100);
                    customLoader.style.opacity = '0';
                    setTimeout(() => customLoader.style.display = 'none', 300);
                }).catch((message) => {
                    loaderStatus.innerText = "Error";
                    alert(message);
                });

            } catch(err) {
                loaderStatus.innerText = "Error";
                console.error(err);
            }
        }

        boot();
    </script>
</body>
</html>
