<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/antonblast@main/">
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="x-icon" href="favicon.png">
    <title>Anton Blast Demo v1.2</title>
    <style>@-webkit-keyframes rotation{from{-webkit-transform:rotate(0)}to{-webkit-transform:rotate(360deg)}}@-moz-keyframes rotation{from{-moz-transform:rotate(0)}to{-moz-transform:rotate(360deg)}}@-o-keyframes rotation{from{-o-transform:rotate(0)}to{-o-transform:rotate(360deg)}}@keyframes rotation{from{transform:rotate(0)}to{transform:rotate(360deg)}}html{background:#fff}body{font-family:arial;margin:0;padding:0;min-height:100vh;min-height:-webkit-fill-available;min-height:fill-available;min-height:100vh;min-width:100vw;background:radial-gradient(56.63% 56.63% at 50% 43.37%,transparent 0,transparent 100%);background-color:#000;display:flex;flex-direction:column;overflow-x:hidden;place-items:center}body.scrollingDisabled{overflow:hidden}.emscripten{padding-right:0;display:block}div.emscripten{text-align:center;font-family:"Lucida Console",Monaco,monospace}canvas.emscripten{display:none;background-color:#000;position:flex;transition:opacity 5s ease-in;-webkit-transition:opacity 5s ease-in;opacity:0;filter:blur(0) grayscale(0);image-rendering:optimizeSpeed;image-rendering:-moz-crisp-edges;image-rendering:-webkit-optimize-contrast;image-rendering:-o-crisp-edges;image-rendering:pixelated;-ms-interpolation-mode:nearest-neighbor}canvas.active{animation-name:fadeIn;animation-duration:2s;opacity:1}canvas.paused{animation-name:blur;animation-duration:.5s;filter:blur(2px) grayscale(1)}canvas.unpaused{animation-name:none}canvas.animatedSizeTransitions{transition:width .3s ease,height .3s ease}@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}@keyframes blur{0%{filter:blur(0) grayscale(0)}100%{filter:blur(2px) grayscale(1)}}.spinner{height:30px;width:30px;-webkit-animation:rotation .8s linear infinite;-moz-animation:rotation .8s linear infinite;-o-animation:rotation .8s linear infinite;animation:rotation .8s linear infinite;border:5px solid #bdff00;border-top:5px solid #719900;border-radius:100%}#status{display:inline-block;vertical-align:top;font-weight:700;color:#fff}#progress{width:250px;height:10px;-webkit-appearance:none;appearance:none;padding:5px}progress[value]::-webkit-progress-bar{background-color:#8492a6;height:10px;border-radius:15px}progress[value]::-webkit-progress-value{background-image:-webkit-linear-gradient(left,#719900,#bdff00);height:10px;border-radius:15px}div.loading{position:absolute;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;justify-content:center;align-items:center;pointer-events:none}div.loading>*{padding:10px;margin:10px}.output-container{text-align:center;margin-top:auto}.output-button{border:none;width:200px;height:25px;margin:5px;border-radius:5px;cursor:pointer;background-color:#000;color:#fff;outline-color:#20c20e;outline-style:dashed;font-family:"Lucida Console",Monaco,monospace}#output{display:none;height:200px;background-color:#000;color:#fff;font-family:"Lucida Console",Monaco,monospace;outline:0;border:none;padding:0;width:100%}#message-container{display:none;min-height:50px;background-color:rgba(20,20,20,.5);outline:0;border:none;padding:0;width:100%;position:absolute;top:0}#messages{margin-left:50px;color:#fff;font-family:"Lucida Console",Monaco,monospace;outline:0;border:none;padding:0}img.qrCode{opacity:1;width:50%;height:50%}#pauseMenuContainer{position:absolute;top:0;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center}#pauseMenuContainer[hidden]{display:none!important;opacity:0}#pauseMenuBorder{background:linear-gradient(135deg,#fa1e4e,transparent 40%);padding:1px;border-radius:4px;clip-path:polygon(10.5px 0,100% 0,100% 100%,0 100%,0 10.5px);width:70vw;max-width:400px}#pauseMenu{display:flex;flex-direction:column;padding:60px 30px 60px 30px;background:linear-gradient(180deg,#2e273f 16.15%,rgba(46,39,63,.79) 56.25%,#2e273f 91.15%);border-radius:4px;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);animation-name:fadeIn;animation-duration:.5s;opacity:1}#pauseMenu button{font-weight:500;font-size:17px;color:#fff;background:#fa1e4e;border:1px solid #fa1e4e;border-radius:6px;padding:12px 24px;margin:5px 0;-webkit-user-select:none;user-select:none}#pauseMenu button#quitButton{background:#fa1E4E40}#pauseMenu button:hover{filter:brightness(1.15)}#pauseMenu button:active{filter:brightness(.85)}#pauseMenu button[hidden]{display:none}</style>
  </head>
  <body>
     <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING... </div>
    <canvas
      class="emscripten"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    >
    </canvas>
    <div id="pauseMenuContainer" hidden>
      <div id="pauseMenuBorder">
        <div id="pauseMenu">
          <button id="resumeButton" onclick="resume()">
            Resume
          </button>
          <button id="quitButton" onclick="quitIfSupported()">
            Quit
          </button>
        </div>
        </div>
    </div>
    <div class="loading">
      <div class="spinner" id="spinner"></div>
      <div class="emscripten" id="status">Downloading...</div>

      <progress value="0" max="100" id="progress" hidden="1"></progress>
    </div>
    <div class="output-container" id="output-container">
	  
      <button class="output-button" onclick="toggleConsole()" title="Lists Console Output and Loading Progress"+>
        Toggle Console
      </button>
	  
      <button id="QRButton" class="output-button" onclick="togglegithub()" title="Sends you to My Github Repository of this Project"+>
        Visit Github Repo
      </button>
	  
      <button id="QR2Button" class="output-button" onclick="toggleclear_site_cache()" title="Fixes Crashes due to the Website being Updated, but also Deletes ALL Saves, so Continue with Caution"+>
        Clear Site Cache
      </button>
		
      <button class="output-button" id="stats-button" onclick="toggleFPS()" title="Enables External FPS Counter"+>
        Enable FPS Counter
      </button>
	    
      <button class="output-button" id="share-button" onclick="togglewebports()" title="Sends you to My Personal Website with a List of All My Web Ports"+>
        View All Web Ports
      </button>
	    
	  <button class="output-button" onclick="togglejoin_discord()" title="Press to Join My Discord Server for Info and Updates"+>
        Join Discord Server
      </button>
	    
      <input id="colorpicker" type="color" onchange="changecolor(this)" title="Changes Color of the Website's Background"+>
      <textarea id="output" rows="8"></textarea>
    </div>

    <div id="message-container">
      <div id="messages">
      </div>
    </div>

    <script>let loadingtext=document.getElementById("loading-text");let doneparts=0;function mergeFiles(fileParts){return new Promise((resolve,reject)=>{let buffers=[];function fetchPart(index){if(index>=fileParts.length){let mergedBlob=new Blob(buffers);let mergedFileUrl=URL.createObjectURL(mergedBlob);resolve(mergedFileUrl);return}fetch(fileParts[index]).then(response=>response.arrayBuffer()).then(data=>{buffers.push(data);doneparts=doneparts+1;loadingtext.textContent="LOADING... ("+doneparts+"/"+maxparts+")";fetchPart(index+1)}).catch(reject)}fetchPart(0)})}let maxparts=0;function getParts(file,start,end){let parts=[];for(let i=start;i<=end;i++){parts.push(file+".part"+i)}maxparts=parts.length+maxparts;loadingtext.textContent="LOADING... ("+doneparts+"/"+maxparts+")";return parts}Promise.all([mergeFiles(getParts("runner.data",1,2))]).then(([runners])=>{window.runnerdata=runners;const originalFetch=window.fetch;window.fetch=async function(input,init){let urlString;if(input instanceof Request){urlString=input.url}else{urlString=String(input)}if(urlString.includes("runner.data")){if(input instanceof Request){input=new Request(window.runnerdata,input)}else{input=window.runnerdata}}return originalFetch(input,init)};const originalOpen=XMLHttpRequest.prototype.open;XMLHttpRequest.prototype.open=function(method,url,...rest){if(url.includes("runner.data")){url=window.runnerdata}return originalOpen.call(this,method,url,...rest)};let index=document.createElement("script");index.src="index.js";document.body.appendChild(index);let runner=document.createElement("script");runner.src="runner.js";document.body.appendChild(runner);loadingtext.remove()});</script>
  </body>
</html>
